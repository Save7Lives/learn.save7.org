# Deploy to Cloudflare Pages on every push to main.
#
# ── WHY A WORKFLOW AND NOT THE PAGES GIT INTEGRATION ─────────────────────────
# The Pages project was created by direct upload, and Cloudflare's docs are
# explicit that this cannot be converted: "If you choose Direct Upload, you cannot
# switch to Git integration later. You will have to create a new project with Git
# integration to use automatic deployments."
#
# A new project would mean moving learn.save7.org across it, a window where the
# course does not serve, and — if the project name could not be reused — editing
# the register-learner Edge Function, whose CORS allow-list names this project's
# hostnames in code rather than as a wildcard.
#
# This runs the same `wrangler pages deploy` that a person would, against the
# project that already exists, with the domain and allow-lists untouched.
#
# ── WHAT IT NEEDS, AND WHAT IT DELIBERATELY DOES NOT ─────────────────────────
# Two repository secrets:
#
#   CLOUDFLARE_API_TOKEN   Account -> Cloudflare Pages -> Edit. Nothing else.
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages -> the ID in the URL
#
# **No Supabase values are needed here.** The app reads its configuration at
# runtime from wrangler.jsonc rather than at build time, so the build has no
# secrets in it at all — see src/lib/supabase/config.ts. The service-role key must
# never be added to this repository.
#
# Until those two secrets exist the workflow fails at the deploy step, having
# already proved the build. That is deliberate: a green build with a failed deploy
# is a clearer signal than a skipped job.
name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push supersedes an older one still running.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects .npmrc, which carries legacy-peer-deps=true — the Pages
      # adapter and wrangler 4 disagree about @cloudflare/workers-types.
      - run: npm ci

      # The gates that used to be run by hand. A failure here stops the deploy.
      - run: npm run typecheck
      - run: npm run lint

      # Builds, then strips the 35 MB video: Pages refuses any asset over 25 MiB
      # and does not honour public/.assetsignore.
      - run: npm run pages:build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=transplant-alchemy --branch=main
