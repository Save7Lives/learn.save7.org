# Build gates for every push to main and every pull request.
#
# ── THIS WORKFLOW DOES NOT DEPLOY ────────────────────────────────────────────
# Deploys come from **Vercel's Git integration**: the Vercel project connected to
# this repository builds every push, publishes `main` to learn.save7.org, and gives
# every other branch a preview URL. Two systems deploying the same site would race,
# so this workflow keeps only what Vercel does not give us for free: the gates. A red
# build here is the signal; the deploy is Vercel's job.
#
# **No Supabase values are needed here.** Every route reads its configuration at
# request time rather than at build time, so the build carries no secrets at all —
# see src/lib/supabase/config.ts. The service-role key must never be added to this
# repository or to the Vercel project.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      - run: npm run build
