# Build gates for every push to main and every pull request.
#
# ── THIS WORKFLOW DOES NOT DEPLOY ────────────────────────────────────────────
# Deploys come from **Vercel's Git integration**: the Vercel project connected to
# this repository builds every push, publishes `main` to learn.save7.org, and gives
# every other branch a preview URL. Two systems deploying the same site would race,
# so this workflow keeps only what Vercel does not give us for free: the gates. A red
# build here is the signal; the deploy is Vercel's job.
#
# **No Supabase values are needed here.** Every route reads its configuration at
# request time rather than at build time, so the build carries no secrets at all —
# see src/lib/supabase/config.ts. The service-role key must never be added to this
# repository or to the Vercel project.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      # The film's files agree: names carry their content hash, the captions are the
      # transcript's words, the registry's size and duration are the file's (#61).
      - run: npm run media:check

      # Dependency advisories: fails on anything high or critical (the same threshold as
      # `npm audit --audit-level=high`) unless scripts/audit-allowlist.json accepts it
      # with a reason and an expiry date. See docs/dependency-advisories.md (#30).
      - run: node scripts/audit-gate.mjs

      - run: npm run build

  # Accessibility and contrast audit (#29): renders the public pages at 375 and 1024 px
  # and fails on a colour pair under WCAG AA, text under 12px or horizontal scroll, after
  # a self-test that plants each defect and checks the audit catches it. Signed-in pages
  # are in scripts/a11y/pages.mjs and run once a test-session helper exists.
  # The app reads only the public Supabase values in .env.example (anon key, by design).
  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:vocabulary

      - run: npx playwright install --with-deps chromium

      - run: cp .env.example .env
      - run: npm run build

      - name: Start the app
        run: |
          npm start -- --port 3000 > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat app.log; exit 1

      - run: npm run audit:a11y
